use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - brave

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: bwc-local-searxng-change-me

search:
  formats:
    - html
    - json

enabled_plugins: []

outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
  pool_connections: 20
  pool_maxsize: 10
